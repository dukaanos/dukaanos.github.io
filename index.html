<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DukaanOS — दुकान का खाता</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--card:#fff;--ink:#16213e;--mut:#5d6883;--line:#d9dfeb;--ac:#1f3a8a;--onac:#fff;--red:#c8102e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1322;--card:#171e35;--ink:#eaeefb;--mut:#a0abc8;--line:#2a3354;--ac:#8ea8ff;--onac:#0e1322;--red:#ff6b81}}
:root[data-theme="dark"]{--bg:#0e1322;--card:#171e35;--ink:#eaeefb;--mut:#a0abc8;--line:#2a3354;--ac:#8ea8ff;--onac:#0e1322;--red:#ff6b81}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:17px/1.45 Mukta,"Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;justify-content:space-between;align-items:center;padding:10px max(16px,calc((100vw - 560px)/2));background:var(--bg);border-bottom:1px solid var(--line)}
header small{color:var(--mut);font-weight:600}h1{margin:0;font-size:22px;font-weight:800}.ic{background:none;border:0;font-size:24px;padding:8px;color:inherit}
main{max-width:560px;margin:0 auto;padding:12px 16px 100px}
.hero{padding:16px 0 6px}.hero small{color:var(--mut)}.big{font-size:52px;font-weight:800;line-height:1.1;color:var(--ac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 14px}.two>div{border-left:3px solid var(--red);padding-left:10px}.two small{display:block}.two b{font-size:22px}
.btns{display:grid;gap:10px;margin:12px 0}.c2{grid-template-columns:1fr 1fr}
.btn{min-height:50px;width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 17px Mukta,sans-serif;padding:0 14px;margin-top:8px;cursor:pointer}.btns .btn{margin-top:0}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--onac)}.btn.dg{color:var(--red);border-color:var(--red)}
h2{font-size:17px;font-weight:800;margin:22px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0 12px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--ac);cursor:pointer}.row.d{border-left-color:var(--red)}
.g{min-width:0}.g b{display:block;overflow-wrap:anywhere}small,.mut{color:var(--mut);font-size:14px}.g small{display:block}.rt{text-align:right;flex-shrink:0}.rt strong{display:block;font-size:19px}.red{color:var(--red)}
.acts{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.sm{display:inline-block;min-height:36px;line-height:33px;padding:0 12px;border-radius:10px;border:1.5px solid var(--ac);color:var(--ac);background:none;font:700 14px Mukta,sans-serif;text-decoration:none;cursor:pointer}
.q{display:flex;align-items:center;gap:10px}.q button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--ac);background:none;color:var(--ac);font-size:22px;font-weight:800}.q span{min-width:24px;text-align:center;font-weight:800}
label{display:block;margin-top:12px;font-weight:600;font-size:15px}
input,select,textarea{display:block;width:100%;margin-top:5px;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:17px Mukta,sans-serif}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.seg button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink);font:700 16px Mukta,sans-serif}.seg .on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.tot{display:flex;justify-content:space-between;align-items:center;margin:14px 0 2px;font-size:19px}.tot b{font-size:26px;color:var(--ac)}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:14px;margin:14px 0}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px;margin-top:10px;border-bottom:2px solid var(--ink)}.bars i{flex:1;background:var(--ac);border-radius:5px 5px 0 0}.bl{display:flex;gap:8px}.bl span{flex:1;text-align:center;font-size:13px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:600 12px Mukta,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}nav button span{font-size:21px}nav .on{color:var(--ac)}
.sh{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}.sh.on{display:flex}
.sb{background:var(--card);width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}.sb h2{margin-top:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;z-index:12;max-width:90%;text-align:center}#toast.on{opacity:1}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pc{border:1.5px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin:10px 0}.pc.on{border-color:var(--ac)}.t3{grid-template-columns:repeat(3,1fr)}
#au{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px}.aw{max-width:420px;margin:24px auto}.aw h1{font-size:32px;margin:6px 0}
</style></head><body>
<header><div><small id="an" onclick="tap5()" style="cursor:pointer">DukaanOS</small><h1 id="sn"></h1></div><div><button class="ic" id="lg" onclick="tgl()" aria-label="Language" style="font-size:15px;font-weight:800">EN</button><button class="ic" onclick="openSet()" aria-label="Settings">⚙️</button></div></header>
<main id="v"></main><nav id="nav"></nav>
<div id="sh" class="sh" onclick="if(event.target===this)cs()"><div class="sb" id="sb"></div></div><div id="toast"></div><div id="au"></div>
<script>
const K='dukaanos_v2';let S={shop:'मेरी दुकान',p:[],c:[],s:[]},tab='home',cart={},pay='cash',cu='';

const sv=()=>svq(),$=i=>document.getElementById(i),R=n=>'₹'+Number(n||0).toLocaleString('en-IN'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),dk=d=>(d||new Date()).toLocaleDateString('en-CA'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=tr(m);t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2200)}
function sheet(h){const y=$('sb').scrollTop;$('sb').innerHTML=tr(h);$('sh').classList.add('on');$('sb').scrollTop=y}
function cs(){$('sh').classList.remove('on')}
function go(t){tab=t;render();scrollTo(0,0)}
function crow(c){const m=T(`नमस्ते ${c.n}, ${S.shop} में आपका ${R(c.due)} बाकी है। कृपया जल्दी चुका दें। धन्यवाद।`,`Hello ${c.n}, you have ${R(c.due)} due at ${S.shop}. Please pay soon. Thank you.`);return `<div class="row d"><div class="g"><b>${esc(c.n)}</b><small>${c.ph?esc(c.ph):'नंबर नहीं'}</small></div><div class="rt"><strong class="${c.due>0?'red':''}">${R(c.due)}</strong><div class="acts">${c.due>0?`<button class="sm" onclick="openPay('${c.id}')">पैसे मिले</button>`:''}${c.ph&&c.due>0?`<a class="sm" href="sms:${c.ph}?body=${encodeURIComponent(m)}">SMS</a>`:''}${c.ph?`<a class="sm" href="tel:${c.ph}">फ़ोन</a>`:''}</div></div></div>`}
function prow(p){return `<div class="row" onclick="openProd('${p.id}')"><div class="g"><b>${esc(p.n)}</b><small>${R(p.pr)} प्रति</small></div><div class="rt"><strong class="${p.st<=5?'red':''}">${p.st}</strong><small>बचा है</small></div></div>`}
const V={
home(){const ts=S.s.filter(x=>x.d===dk()),sum=ts.reduce((a,x)=>a+x.total,0),cr=ts.filter(x=>x.cr).reduce((a,x)=>a+x.total,0),due=S.c.reduce((a,x)=>a+x.due,0),low=S.p.filter(x=>x.st<=5),td=S.c.filter(x=>x.due>0).sort((a,b)=>b.due-a.due).slice(0,3);
return `<section class="hero"><small>आज की बिक्री</small><div class="big">${R(sum)}</div><small>नकद ${R(sum-cr)}, उधार ${R(cr)}, ${ts.length} बिल</small></section>
<div class="two"><div><small>कुल उधार बाकी</small><b class="red">${R(due)}</b></div><div><small>कम स्टॉक</small><b>${low.length} सामान</b></div></div>
<div class="btns c2"><button class="btn p" onclick="openSale()">➕ नई बिक्री</button><button class="btn" onclick="go('due')">📒 उधार खाता</button></div>
${S.p.length?'':`<div class="empty">शुरू करने के लिए अपना सामान, कीमत और स्टॉक जोड़ें।<button class="btn p" onclick="openProd()">सामान जोड़ें</button></div>`}
${td.length?`<h2>इनसे पैसे लेने हैं</h2>${td.map(crow).join('')}`:''}${low.length?`<h2>जल्दी मँगाना है</h2>${low.slice(0,5).map(prow).join('')}`:''}`},
sale(){const ts=S.s.filter(x=>x.d===dk()).reverse();return `<div class="btns"><button class="btn p" onclick="openSale()">➕ नई बिक्री</button></div><h2>आज के बिल</h2>${ts.length?ts.map(x=>`<div class="row"><div class="g"><b>${esc(x.items.map(i=>i.n+' × '+i.q).join(', '))}</b><small>${x.t}${x.cn?', '+esc(x.cn):''}</small></div><div class="rt"><strong>${R(x.total)}</strong><small class="${x.cr?'red':''}">${x.cr?'उधार':'नकद'}</small></div></div>`).join(''):'<p class="mut">आज अभी कोई बिक्री नहीं हुई।</p>'}`},
due(){const c=[...S.c].sort((a,b)=>b.due-a.due);return `<div class="btns"><button class="btn p" onclick="openCust()">➕ नया ग्राहक</button></div><p class="mut">SMS और फ़ोन बटन हर साधारण फ़ोन पर चलते हैं, WhatsApp की ज़रूरत नहीं।</p>${c.length?c.map(crow).join(''):'<p class="mut">अभी कोई ग्राहक नहीं। जिन्हें उधार देते हैं, उनका नाम, नंबर और पुराना बाकी जोड़ें।</p>'}`},
stock(){return `<div class="btns"><button class="btn p" onclick="openProd()">➕ नया सामान</button></div>${S.p.length?'<p class="mut">सामान पर टैप करके कीमत या स्टॉक बदलें। 5 या कम बचे तो लाल दिखेगा।</p>'+S.p.map(prow).join(''):'<p class="mut">अभी कोई सामान नहीं। अपनी दुकान का सामान, कीमत और स्टॉक जोड़ें।</p>'}`},
rep(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d}),k=days.map(dk),v=k.map(x=>S.s.filter(s=>s.d===x).reduce((a,s)=>a+s.total,0)),mx=Math.max(...v,1),wk=['रवि','सोम','मंगल','बुध','गुरु','शुक्र','शनि'],m={};S.s.filter(s=>k.includes(s.d)).forEach(s=>s.items.forEach(i=>m[i.n]=(m[i.n]||0)+i.q));const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
return `<section class="hero"><small>पिछले 7 दिन की बिक्री</small><div class="big">${R(v.reduce((a,b)=>a+b,0))}</div></section><div class="bars">${v.map(x=>`<i style="height:${Math.max(x/mx*100,2)}%" title="${R(x)}"></i>`).join('')}</div><div class="bl">${days.map(d=>`<span>${wk[d.getDay()]}</span>`).join('')}</div><h2>सबसे ज़्यादा बिकने वाले</h2>${top.length?top.map(([n,q])=>`<div class="row"><div class="g"><b>${esc(n)}</b></div><div class="rt"><strong>${q}</strong><small>बिके</small></div></div>`).join(''):'<p class="mut">बिक्री होने पर यहाँ दिखेगा।</p>'}`}};
function render(){$('sn').textContent=tr(S.shop);$('an').textContent=C.app;$('lg').textContent=C.lang==='en'?'हिं':'EN';document.documentElement.lang=C.lang;$('nav').innerHTML=[['home','🏠','होम'],['sale','🧾','बिक्री'],['due','📒','उधार'],['stock','📦','स्टॉक'],['rep','📊','रिपोर्ट']].map(([k,e,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${e}</span>${l}</button>`).join('');$('v').innerHTML=tr(C.mt&&!isOwner()?`<div class="empty"><b>${T('ऐप में सुधार चल रहा है। थोड़ी देर बाद आएँ।','App is under maintenance. Please come back soon.')}</b></div>`:(tab==='home'&&C.ann?`<div class="empty"><b>${esc(C.ann)}</b></div>`:'')+V[tab]());$('nav').innerHTML=tr($('nav').innerHTML)}
function openSale(){cart={};pay='cash';cu='';saleSheet()}
function saleSheet(){if(!S.p.length){sheet(`<h2>सामान नहीं है</h2><p class="mut">पहले स्टॉक में सामान जोड़ें।</p><button class="btn p" onclick="openProd()">सामान जोड़ें</button>`);return}
const tot=S.p.reduce((a,p)=>a+(cart[p.id]||0)*p.pr,0);
sheet(`<h2>नई बिक्री</h2>${S.p.map(p=>`<div class="row"><div class="g"><b>${esc(p.n)}</b><small>${R(p.pr)}, बचा ${p.st}</small></div><div class="q"><button onclick="qty('${p.id}',-1)" aria-label="कम">−</button><span>${cart[p.id]||0}</span><button onclick="qty('${p.id}',1)" aria-label="ज़्यादा">+</button></div></div>`).join('')}
<label>ग्राहक (उधार के लिए चुनें)<select onchange="cu=this.value;if(!cu)pay='cash';saleSheet()"><option value="">सामान्य ग्राहक</option>${S.c.map(c=>`<option value="${c.id}" ${c.id===cu?'selected':''}>${esc(c.n)}</option>`).join('')}</select></label>
<div class="seg"><button class="${pay==='cash'?'on':''}" onclick="pay='cash';saleSheet()">नकद मिला</button><button class="${pay==='credit'?'on':''}" onclick="if(!cu)return toast('उधार के लिए पहले ग्राहक चुनें');pay='credit';saleSheet()">उधार</button></div>
<div class="tot">कुल <b>${R(tot)}</b></div><button class="btn p" onclick="saveSale()">बिक्री सेव करें</button>`)}
function qty(id,d){const p=S.p.find(x=>x.id===id);let n=Math.max(0,(cart[id]||0)+d);if(n>p.st){toast('स्टॉक में सिर्फ़ '+p.st+' बचे हैं');n=p.st}cart[id]=n;saleSheet()}
function saveSale(){const it=S.p.filter(p=>cart[p.id]>0).map(p=>({id:p.id,n:p.n,q:cart[p.id],pr:p.pr}));if(!it.length)return toast('कम से कम एक सामान चुनें');const total=it.reduce((a,i)=>a+i.q*i.pr,0),c=S.c.find(x=>x.id===cu),cr=pay==='credit'&&!!c;it.forEach(i=>{S.p.find(p=>p.id===i.id).st-=i.q});if(cr)c.due+=total;S.s.push({id:uid(),d:dk(),t:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),items:it,total,cr,cn:c?c.n:''});sv();cs();render();toast('बिक्री सेव हो गई')}
function openProd(id){const p=S.p.find(x=>x.id===id)||{};sheet(`<h2>${id?'सामान बदलें':'नया सामान'}</h2><label>नाम<input id="pn" value="${esc(p.n||'')}" placeholder="जैसे: चावल 1 किलो"></label><label>कीमत (₹)<input id="pp" type="number" inputmode="decimal" value="${p.pr??''}"></label><label>स्टॉक में कितना है<input id="ps" type="number" inputmode="numeric" value="${p.st??''}"></label><button class="btn p" onclick="saveProd('${id||''}')">सेव करें</button>${id?`<button class="btn dg" onclick="delProd('${id}')">हटाएँ</button>`:''}`)}
function saveProd(id){const n=$('pn').value.trim(),pr=parseFloat($('pp').value),st=parseInt($('ps').value)||0,p=S.p.find(x=>x.id===id);if(!n||!(pr>=0))return toast('नाम और कीमत भरें');if(p){p.n=n;p.pr=pr;p.st=st}else{if(over('mp',S.p))return;S.p.push({id:uid(),n,pr,st})};sv();cs();render()}
function delProd(id){if(confirm(tr('इस सामान को हटाएँ?'))){S.p=S.p.filter(x=>x.id!==id);sv();cs();render()}}
function openCust(){sheet(`<h2>नया ग्राहक</h2><label>नाम<input id="cn"></label><label>फ़ोन नंबर (SMS के लिए)<input id="cp" type="tel" inputmode="tel" placeholder="10 अंक"></label><label>पुराना उधार बाकी (₹), हो तो<input id="cd" type="number" inputmode="decimal"></label><button class="btn p" onclick="saveCust()">सेव करें</button>`)}
function saveCust(){const n=$('cn').value.trim(),ph=$('cp').value.replace(/[^\d+]/g,''),due=parseFloat($('cd').value)||0;if(!n)return toast('नाम भरें');if(over('mc',S.c))return;S.c.push({id:uid(),n,ph,due});sv();cs();render()}
function openPay(id){const c=S.c.find(x=>x.id===id);sheet(`<h2>${esc(c.n)} से पैसे मिले</h2><p class="mut">अभी बाकी: ${R(c.due)}</p><label>कितने मिले (₹)<input id="pa" type="number" inputmode="decimal" value="${c.due}"></label><button class="btn p" onclick="savePay('${id}')">सेव करें</button>`)}
function savePay(id){const a=parseFloat($('pa').value),c=S.c.find(x=>x.id===id);if(!(a>0))return toast('रकम भरें');c.due=Math.max(0,c.due-a);sv();cs();render();toast('जमा हो गया')}
function openSet(){sheet(`<h2>सेटिंग</h2><label>दुकान का नाम<input id="sn2" value="${esc(S.shop)}"></label><button class="btn p" onclick="S.shop=$('sn2').value.trim()||'मेरी दुकान';sv();cs();render()">सेव करें</button><p class="mut">आपका डेटा सिर्फ़ इसी फ़ोन के ब्राउज़र में रहता है। ब्राउज़र का डेटा साफ़ करने पर मिट जाएगा, इसलिए बैकअप कॉपी करके कहीं रख लें।</p><button class="btn" onclick="FB.signOut(FB.auth)">${T('लॉग आउट','Log out')}</button><button class="btn" onclick="openPlans()">💎 ${T('प्लान','Plans')}</button><button class="btn" onclick="bk()">बैकअप कॉपी करें</button><label>बैकअप वापस डालें<textarea id="rb" rows="3"></textarea></label><button class="btn" onclick="rs()">वापस डालें</button><button class="btn dg" onclick="if(confirm('सारा डेटा मिट जाएगा। पक्का?')){S={shop:S.shop,p:[],c:[],s:[]};sv();cs();render()}">सारा डेटा मिटाएँ</button>`)}
