<script>

const V={
home(){const ts=S.s.filter(x=>x.d===dk()),sum=ts.reduce((a,x)=>a+x.total,0),cr=ts.filter(x=>x.cr).reduce((a,x)=>a+x.total,0),due=S.c.reduce((a,x)=>a+x.due,0),low=S.p.filter(x=>x.st<=5),td=S.c.filter(x=>x.due>0).sort((a,b)=>b.due-a.due).slice(0,3);
